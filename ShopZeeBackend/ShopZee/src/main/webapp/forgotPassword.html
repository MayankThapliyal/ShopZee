<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/forgotPassword.css">
    <title>Forgot Password</title>
</head>
<body>
    <h2>Reset Your Password</h2>
    <div id="form-container">
    <form id="forgotPasswordForm">
        <label for="username">Username:&nbsp;</label>
        <input type="text" id="username" placeholder="Enter Username" required><br><br>
        <label for="newPassword">New Password:&nbsp;</label>
        <input type="password" id="newPassword" placeholder="Enter New Password" required><br><br>
        <label for="confirmPassword">Confirm New Password:&nbsp;</label>
        <input type="password" id="confirmPassword" placeholder="Confirm New Password" required><br><br>
        <button type="submit">Submit</button>
    </form>
    </div>

    <script>
        document.getElementById("forgotPasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            //fetch("http://localhost:8080/api/user/forgot-password", {
			  fetch("/ShopZee/api/user/forgot-password",{
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    newPassword: newPassword
                })
            })
            .then(response => {
                if (!response.ok) throw new Error("Password update failed");
                return response.text();
            })
            .then(data => {
                alert("Password successfully updated!");
                window.location.href = "login.html"; // redirect to login
            })
            .catch(error => alert(error.message));
        });
    </script>
</body>
</html>
