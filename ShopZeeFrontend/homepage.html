<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/homepage.css">

    <style>
        .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: white;
    padding: 35px;
    border-radius: 10px;
    width: 80%;
    height: 80%;
  }
    </style>
</head>

<body>
    <h2 id="head">ShopZee... A one-stop shop for all your needs!!!</h2>

    <nav class="navBar">
        <ul class="nav-links">
            <div class="profile-dropdown">
                <span id="profileName">Profile ▾</span>
                <div class="dropdown-content" id="profileDropdown">
                    <a href="myaccount.html" id="myAccountLink">My Account</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
            <li><a href="#" onclick="openOffers()">Offers</a></li>
            <li><a href="cart.html" target="_blank">Cart</a></li>
            <li><a href="wishlist.html" target="_blank">Wishlist</a></li>
            <li><a href="orders.html" target="_blank">My Orders</a></li>

        </ul>
    </nav>
    <div id="offersModal" class="modal">
        <div class="modal-content">
            <span onclick="closeOffers()" style="float:right; cursor: pointer;"><b>&times;</b></span>
            <iframe src="offers.html" width="100%" height="100%" style="border:none;"></iframe>
        </div>
    </div>

    <h2>Available Products</h2>
    <section class="search-bar">
        <input type="text" class="search" id="searchInput" placeholder="Search Products...">
        <select id="categorySelect">
            <option value="all">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Accessories">Accessories</option>
            <option value="Footwear">Footwear</option>
            <option value="Kitchen">Kitchen</option>
            <option value="Bags">Bags</option>
            <option value="Mobiles">Mobiles</option>

        </select>

        <button id="searchBtn" class="search-btn">Search</button>
    </section>
    <section class="product-section">

        <div class="product-grid">

        </div>
    </section>
    <script src="./js/homepage.js" defer></script>
    <script src="./js/profile.js" defer></script>
    <script>
        function openOffers(){
            document.getElementById('offersModal').style.display='flex';
        }
        function closeOffers(){
            document.getElementById('offersModal').style.display = 'none';
        }
    </script>
</body>

</html>
