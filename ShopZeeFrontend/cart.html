<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cart.css">
    <link rel="stylesheet" href="./css/homepage.css">
    <title>Your Cart</title>
</head>

<body>
    
    <h2 id="head">ShopZee... A one-stop shop for all your needs!!!</h2>
    
    <nav class="navBar">
        <ul class="nav-links">
            <div class="profile-dropdown">
                <span id="profileName">Profile ▾</span>
                <div class="dropdown-content" id="profileDropdown">
                    <a href="myaccount.html" id="myAccountLink">My Account</a>
                    <a href="#" id="logoutBtn">Logout</a>
                </div>
            </div>
            <li><a href="./homepage.html" target="_blank">Home</a></li>
            <li><a href="wishlist.html" target="_blank">Wishlist</a></li>
        </ul>
    </nav>
    <header style="display:flex; justify-content: space-between;">
        <h1>Your Cart</h1>
        <h3 id="totalAmount">Total: ₹0</h3>
        <button id="proceedToPayBtn" style="margin: 25px; padding: 5px 18px;">
  Proceed to Pay
</button>

    </header>
    <main>
        <div id="head-div" style="display:flex; justify-content: space-between;">
        <h2 id="cartHeading">Current items in the cart</h2> 
        <button id="emptyCartBtn" style="float:right; padding: 15px 18px; cursor: pointer; margin: 1%;">Empty Cart</button>
        </div>
        <div class="product-grid" id="cartGrid"></div>
        <p class="empty-message" id="emptyMessage" style="display:none">Cart is empty. <br>Shop now to add items here!!!</p>
  </main>
  <script src="./js/cart.js"></script>
  <script src="./js/profile.js"></script>
</body>
</html>
